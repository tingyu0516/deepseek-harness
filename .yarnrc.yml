enableScripts: false
nmHoistingLimits: workspaces
nodeLinker: node-modules

# Official DSH packages are pinned by exact version. Yarn's default
# npmMinimalAgeGate otherwise quarantines a same-day rc family.
# Preinstalled community plugins are also exact pins; a same-day npm
# publish would otherwise fail `yarn add` with YN0016 quarantine.
# GitHub-only plugins need an explicit git allowlist; Yarn otherwise
# refuses the clone with YN0080.
approvedGitRepositories:
  - https://github.com/MarvekG/deepseek-harness-model-config.git
npmPreapprovedPackages:
  - "@deepseek-ai/*"
  - "@changfenhuang/dsh-genui"
  - "@linxin666/dsh-client-ui-task-board"
  - "@linxin666/dsh-remote-web-ui"
  - "@liustack/modsearch"
  - "ds-harness-remote"
  - "dsh-better-sidebar"
  - "dsh-context"
  - "dsh-models-config-plugin"

# macOS releases are universal, so the physical node_modules tree must contain
# both Darwin CPU variants before Electron Builder assembles the two slices.
supportedArchitectures:
  os:
    - current
  cpu:
    - current
    - x64
    - arm64
