# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
    - id: desktop-pet-hutao
      name: dsh-plugin-pet-hutao
    - id: desktop-pet-furina
      name: dsh-plugin-pet-furina
    - id: better-sidebar
      name: dsh-better-sidebar
      disabled: !!js "[...ctx.loader.entries()].some((e) => e.options.name === 'dsh-better-sidebar' && e.options.id !== 'better-sidebar' && !e.disabled)"
    - id: remote-web-ui
      name: '@linxin666/dsh-remote-web-ui'
    - id: ui-task-board
      name: '@linxin666/dsh-client-ui-task-board'
    - id: dsh-context
      name: dsh-context
    - id: genui
      name: '@changfenhuang/dsh-genui'
    - id: models-config-plugin
      name: dsh-models-config-plugin
    - id: modsearch
      name: '@liustack/modsearch'
    - id: ds-harness-remote
      name: ds-harness-remote
      disabled: !!js "[...ctx.loader.entries()].some(entry => (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui') && !entry.disabled)"
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex
    - id: ds-harness-remote-tui
      name: ds-harness-remote
      disabled: !!js "![...ctx.loader.entries()].some(entry => (entry.options.id === 'dsh-tui' || entry.options.name === '@deepseek-harness-tui/dsh-tui') && !entry.disabled)"
      inject: [settings, typertGateway, commands, tuiCommandTrees, tuiScenes]
      config:
        enabled: true
        role: host
        serverUrl: https://dsh.r2049.cn
        codex:
          enabled: true
          binary: codex

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# A patch row replaces the targeted web config; keep fetchProvider from the base row.
- id: web
  config:
    searchProvider: modsearch
    fetchProvider: http
